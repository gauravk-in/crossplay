# FORK CHANGE: Gaurav's personal OTA feed. Every push to `integration` builds
# the x4pro_ota env and publishes it as a GitHub release on this fork, which is
# what Settings > Check for Updates on an x4pro_ota build reads
# (scripts_local/publish-ota.sh says how the version and the feed URL work).
#
# Needs two repository secrets, GTASKS_CLIENT_ID and GTASKS_CLIENT_SECRET, so
# the Tasks and Calendar apps can sign in. They never live in git.
name: Personal OTA release

on:
  push:
    branches: [integration]
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes the older build pointless: only the latest release is
# ever offered to the device.
concurrency:
  group: personal-ota
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # publish-ota.sh checks that HEAD is on a remote branch.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-ota-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build and publish
        env:
          GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSSPLAY_OTA_REPO: ${{ github.repository }}
          GTASKS_CLIENT_ID: ${{ secrets.GTASKS_CLIENT_ID }}
          GTASKS_CLIENT_SECRET: ${{ secrets.GTASKS_CLIENT_SECRET }}
        run: |
          if [ -z "$GTASKS_CLIENT_ID" ] || [ -z "$GTASKS_CLIENT_SECRET" ]; then
            echo "::error::Set the GTASKS_CLIENT_ID and GTASKS_CLIENT_SECRET repository secrets; without them Tasks and Calendar cannot sign in"
            exit 1
          fi
          export PLATFORMIO_BUILD_FLAGS="-DGTASKS_CLIENT_ID='\"$GTASKS_CLIENT_ID\"' -DGTASKS_CLIENT_SECRET='\"$GTASKS_CLIENT_SECRET\"'"
          ./scripts_local/publish-ota.sh
