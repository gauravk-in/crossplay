# docker compose -f server/appstore/compose.yaml up -d   (from the repository root)
services:
  appstore:
    build:
      context: ../..
      dockerfile: server/appstore/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APPSTORE_TOKEN: ${APPSTORE_TOKEN:?set APPSTORE_TOKEN to a long random string}
    volumes:
      - appstore-data:/data
volumes:
  appstore-data:
