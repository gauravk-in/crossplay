# The Google Tasks sign-in service. It must be reached over HTTPS at
# TASKS_PUBLIC_URL (Google refuses a plain-http redirect for a web client), so
# put it behind whatever already terminates TLS on the box: a Cloudflare
# Tunnel like the other bridges here, or a reverse proxy pointed at
# 127.0.0.1:8090. Nothing is published beyond loopback.

networks:
  tasksbridge:
    name: tasksbridge
    ipam:
      config:
        # Its own /24, apart from the other bridges' (84, 85, 86, 87).
        - subnet: 172.31.88.0/24

services:
  tasksbridge:
    build: .
    image: tasksbridge:local
    container_name: tasksbridge
    restart: unless-stopped
    networks: [tasksbridge]
    ports:
      - "127.0.0.1:8090:8080"
    dns:
      - 1.1.1.1
      - 9.9.9.9
    environment:
      TASKS_DATA: /data
      TASKS_FERNET_KEY: ${TASKS_FERNET_KEY}
      TASKS_PUBLIC_URL: ${TASKS_PUBLIC_URL}
      TASKS_ALLOWLIST: ${TASKS_ALLOWLIST}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./data:/data
    user: "10005:10005"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()"]
      interval: 60s
      timeout: 10s
      retries: 3
